<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker Registration</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body style="background: #f8fafc;">
    <div class="page-shell" style="max-width: 520px; padding-top: 70px; color: #111;">
      <div class="panel" style="padding: 36px; background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 28px 80px rgba(15, 23, 42, 0.08); color: #111;">
        <h2>Create your account</h2>
        <p style="color: #475569; margin-bottom: 28px;">Register now and start building habits with public and private challenges, progress tracking, and reminders.</p>
        <form>
          <label style="display: block; margin-bottom: 14px; color: #475569; font-size: 0.95rem;">Username</label>
          <input type="text" placeholder="Choose a username" required style="width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a; margin-bottom: 18px;" />
          <label style="display: block; margin-bottom: 14px; color: #475569; font-size: 0.95rem;">Password</label>
          <input type="password" placeholder="Create a password" required style="width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a; margin-bottom: 24px;" />
          <button class="button primary" type="submit" style="width: 100%;">Register</button>
        </form>
        <p class="footer-notes" style="margin-top: 24px; text-align: center;">
          Already have an account? <a href="login.html" style="color: var(--primary);">Log in</a>
        </p>
      </div>
    </div>
  </body>
</html>
